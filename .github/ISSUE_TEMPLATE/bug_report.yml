name: Bug report
description: Report a reproducible problem in Meridian
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Meridian. Please remove private clock arrangements or other personal information from screenshots and backups.
  - type: input
    id: version
    attributes:
      label: Meridian version
      description: Find this on the Chrome Web Store listing or extension details page.
      placeholder: 1.2.2
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Chrome 152 on macOS 26.5
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that shows the problem.
      placeholder: |
        1. Open a new tab
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, console errors, or other useful details. Do not attach unredacted backup files.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed personal information from any attached material.
          required: true
