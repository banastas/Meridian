<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meridian — Marquee promo tile</title>
    <link rel="stylesheet" href="promo.css" />
  </head>
  <body>
    <main class="asset marquee" aria-label="Meridian promotional artwork">
      <div class="brand">
        <img class="brand-mark" src="../icons/icon128.png?v=meridian-globe" alt="" />
        <p class="eyebrow">Meridian</p>
      </div>

      <div class="copy">
        <h1 class="headline">Your world,<br />perfectly timed.</h1>
        <p class="tagline">
          A beautiful new tab for seeing, planning, and connecting across time zones.
        </p>
      </div>

      <section class="clock-row" aria-label="Example world clocks">
        <div class="clock">
          <p class="city">Los Angeles</p>
          <p class="time">14:12</p>
          <p class="date">Tue, Jul 14</p>
          <p class="offset">−9h</p>
        </div>
        <div class="clock">
          <p class="city">Paris</p>
          <p class="time">23:12</p>
          <p class="date">Tue, Jul 14</p>
          <p class="offset">Home timezone</p>
        </div>
        <div class="clock">
          <p class="city">Tokyo</p>
          <p class="time">06:12</p>
          <p class="date">Wed, Jul 15</p>
          <p class="offset">+7h</p>
        </div>
      </section>
    </main>
  </body>
</html>
