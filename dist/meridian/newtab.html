<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meridian</title>
  <link rel="icon" href="icons/icon16.png" sizes="16x16" type="image/png">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <!-- Toolbar -->
  <div id="toolbar">
    <button id="add-btn" title="Add timezone" data-i18n-title="addTimezone">+</button>
    <button id="settings-btn" title="Settings" data-i18n-title="settings">⚙</button>
  </div>

  <!-- Search overlay -->
  <div id="search-overlay" class="hidden">
    <div id="search-container">
      <input type="text" id="search-input" placeholder="Search city or timezone..." data-i18n-placeholder="searchCityOrTimezone" autocomplete="off">
      <ul id="search-results"></ul>
    </div>
  </div>

  <!-- Settings panel -->
  <div id="settings-panel" class="hidden">
    <label>
      <input type="checkbox" id="toggle-24h"> <span data-i18n="format24h">24-hour format</span>
    </label>
    <label>
      <input type="checkbox" id="toggle-seconds"> <span data-i18n="showSeconds">Show seconds</span>
    </label>
  </div>

  <!-- First-run modal -->
  <div id="first-run-modal" class="hidden">
    <div id="first-run-content">
      <h1 data-i18n="welcomeTitle">Welcome to Meridian</h1>
      <p data-i18n="welcomeBody">Select your home timezone to get started.</p>
      <input type="text" id="home-search" placeholder="Search your city..." data-i18n-placeholder="searchYourCity" autocomplete="off">
      <ul id="home-results"></ul>
      <div id="home-detected"></div>
    </div>
  </div>

  <!-- Toast for transient feedback -->
  <div id="toast" class="hidden"></div>

  <!-- Continuous gradient canvas -->
  <canvas id="gradient-canvas"></canvas>

  <!-- Timezone columns container -->
  <div id="columns"></div>

  <script src="newtab.js"></script>
</body>
</html>
